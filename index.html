<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Thync Student Portal"/>
  <title>Thync</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23339f93'/><text x='50%25' y='57%25' dominant-baseline='middle' text-anchor='middle' font-size='20' fill='white' font-family='sans-serif' font-weight='bold'>T</text></svg>"/>

  <!--
    React 18 + Babel Standalone.
    Script INLINED — avoids CORS block on file:// protocol.
    For production: replace with Vite/webpack build.
  -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
/* ─────────────────────────────────────────────────────────────
   CSS CUSTOM PROPERTIES  – light & dark
───────────────────────────────────────────────────────────── */
:root {
  /* Palette */
  --c-bg:         #fbf7f4;
  --c-bg2:        #fff9f5;
  --c-bg-grad:    linear-gradient(150deg,#fbf7f4 0%,#fff9f5 40%,#f7efe5 100%);
  --c-surface:    rgba(255,255,255,0.78);
  --c-surface2:   rgba(255,255,255,0.55);

  /* Brand */
  --brand:        #339f93;
  --brand-d:      #2a8579;
  --brand-l:      #4db8ac;
  --brand-faint:  rgba(51,159,147,.12);

  /* Accent / CTA */
  --accent:       #eea675;
  --accent-d:     #d4875a;
  --accent-faint: rgba(238,166,117,.15);

  /* Text */
  --c-text:       #2c2422;
  --c-muted:      #8a7f7b;
  --c-light:      #b5aba6;
  --c-border:     rgba(44,36,34,.09);
  --c-divider:    rgba(44,36,34,.06);

  /* Liquid Glass */
  --glass-bg:         rgba(255,255,255,.60);
  --glass-bg-card:    rgba(255,255,255,.72);
  --glass-border:     rgba(255,255,255,.55);
  --glass-hi:         rgba(255,255,255,.80);   /* inner top-edge highlight */
  --glass-blur:       blur(28px) saturate(200%) brightness(1.04);
  --glass-shadow:     0 8px 32px rgba(44,36,34,.10),
                      inset 0 1.5px 0 rgba(255,255,255,.75),
                      inset 0 -1px 0 rgba(44,36,34,.03);

  /* Shadows */
  --sh-xs: 0 1px 4px  rgba(44,36,34,.06);
  --sh-sm: 0 2px 12px rgba(44,36,34,.08);
  --sh-md: 0 4px 24px rgba(44,36,34,.12);
  --sh-lg: 0 8px 40px rgba(44,36,34,.20);

  /* Radii */
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-xl: 20px; --r-2xl: 28px;

  /* Transitions */
  --t-fast: .18s cubic-bezier(.4,0,.2,1);
  --t-base: .28s cubic-bezier(.4,0,.2,1);
  --t-slow: .45s cubic-bezier(.4,0,.2,1);

  /* Layout */
  --sidebar-w: 220px;
  --topbar-h:  68px;
}

/* ── Dark mode overrides ── */
:root.dark {
  --c-bg:        #0e0d14;
  --c-bg2:       #14121c;
  --c-bg-grad:   linear-gradient(150deg,#0e0d14 0%,#14121c 40%,#1a1526 100%);
  --c-surface:   rgba(28,25,40,.80);
  --c-surface2:  rgba(20,18,30,.65);

  --brand:       #4db8ac;
  --brand-d:     #3aa89c;
  --brand-l:     #63cac0;
  --brand-faint: rgba(77,184,172,.14);

  --accent:      #eea675;
  --accent-d:    #d4875a;
  --accent-faint:rgba(238,166,117,.14);

  --c-text:      #f0ede8;
  --c-muted:     #9b9290;
  --c-light:     #5e5a58;
  --c-border:    rgba(255,255,255,.09);
  --c-divider:   rgba(255,255,255,.05);

  --glass-bg:       rgba(26,23,38,.72);
  --glass-bg-card:  rgba(30,27,44,.80);
  --glass-border:   rgba(255,255,255,.11);
  --glass-hi:       rgba(255,255,255,.06);
  --glass-blur:     blur(28px) saturate(160%) brightness(.92);
  --glass-shadow:   0 8px 32px rgba(0,0,0,.45),
                    inset 0 1.5px 0 rgba(255,255,255,.07),
                    inset 0 -1px 0 rgba(0,0,0,.15);

  --sh-xs: 0 1px 4px  rgba(0,0,0,.22);
  --sh-sm: 0 2px 12px rgba(0,0,0,.30);
  --sh-md: 0 4px 24px rgba(0,0,0,.42);
  --sh-lg: 0 8px 40px rgba(0,0,0,.60);
}

/* ─────────────────────────────────────────────────────────────
   RESET
───────────────────────────────────────────────────────────── */
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { height:100%; }
body {
  font-family:'Poppins',sans-serif;
  background: var(--c-bg-grad);
  min-height:100%;
  color: var(--c-text);
  -webkit-font-smoothing:antialiased;
  transition: background var(--t-slow), color var(--t-base);
}
img  { display:block; max-width:100%; }
button { font-family:inherit; cursor:pointer; }
a  { text-decoration:none; }
:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }

/* ── Scrollbar ── */
* { scrollbar-width:thin; scrollbar-color: rgba(51,159,147,.35) transparent; }
*::-webkit-scrollbar { width:5px; height:5px; }
*::-webkit-scrollbar-track { background:transparent; }
*::-webkit-scrollbar-thumb { background:rgba(51,159,147,.35); border-radius:3px; }
*::-webkit-scrollbar-thumb:hover { background:var(--brand); }

/* ── sr-only ── */
.sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }

/* ─────────────────────────────────────────────────────────────
   LIQUID GLASS HELPER
   Applied directly in each ruleset for flexibility
───────────────────────────────────────────────────────────── */

/* ─────────────────────────────────────────────────────────────
   APP SHELL  – fixed sidebar + scrollable main column
───────────────────────────────────────────────────────────── */
.app-shell {
  display:flex;
  min-height:100vh;
}

/* ── SIDEBAR – fixed, glass ── */
.sidebar {
  width: var(--sidebar-w);
  height: 100vh;
  position: fixed;
  left:0; top:0;
  z-index:300;
  display:flex;
  flex-direction:column;
  padding:28px 14px;
  gap:4px;
  overflow-y:auto;
  overflow-x:hidden;

  /* Liquid glass */
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-right: 1px solid var(--glass-border);
  box-shadow: 4px 0 40px rgba(44,36,34,.08),
              inset -1px 0 0 var(--glass-hi);
  transition: background var(--t-slow), box-shadow var(--t-base);
}

.nav-menu { list-style:none; flex:1; display:flex; flex-direction:column; gap:2px; }
.nav-item  {}
.nav-link  {
  display:flex; align-items:center; gap:11px;
  padding:11px 14px;
  border-radius:var(--r-lg);
  color: var(--c-muted);
  font-size:14px; font-weight:400;
  transition: all var(--t-fast);
  position:relative;
  overflow:hidden;
}
.nav-link::before {
  content:'';
  position:absolute;inset:0;
  background: var(--brand);
  opacity:0;
  border-radius:var(--r-lg);
  transition:opacity var(--t-fast);
}
.nav-link:hover:not(.active) { color:var(--c-text); background:var(--brand-faint); }
.nav-link.active {
  color:#fff;
  font-weight:500;
}
.nav-link.active::before { opacity:1; }
.nav-link > * { position:relative; z-index:1; }
.nav-icon { width:22px; height:22px; flex-shrink:0; }

.settings-link {
  margin-top:auto;
  padding-top:16px;
  border-top:1px solid var(--c-border);
}

/* ── MAIN COLUMN ── */
.main-col {
  flex:1;
  margin-left: var(--sidebar-w);
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* ── TOP BAR – glass strip ── */
.top-bar-wrap {
  position:sticky; top:0; z-index:200;
  padding:12px 20px 0;
}
.top-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 24px;
  border-radius:var(--r-xl);
  height: var(--topbar-h);

  /* Liquid glass */
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  transition: background var(--t-slow), box-shadow var(--t-base);
}

/* ── SCROLL AREA ── */
.scroll-area { flex:1; padding:14px 20px 28px; }

/* ── CONTENT CARD ── */
.content-card {
  background: var(--glass-bg-card);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  border-radius:var(--r-2xl);
  padding:36px 44px;
  transition: background var(--t-slow);
}

/* ─────────────────────────────────────────────────────────────
   TOP BAR CONTENTS
───────────────────────────────────────────────────────────── */
.search-box {
  display:flex; align-items:center; gap:8px;
  background: var(--c-surface2);
  border:1px solid var(--glass-border);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius:var(--r-xl);
  padding:8px 16px;
  width:300px;
  transition: all var(--t-fast);
}
.search-box:focus-within {
  border-color: var(--brand);
  background: var(--glass-bg);
  box-shadow: 0 0 0 3px var(--brand-faint);
}
.search-box span { width:20px;height:20px;flex-shrink:0;color:var(--c-muted); }
.search-box input {
  border:none; outline:none; flex:1;
  font-size:14px; font-family:inherit;
  background:transparent; color:var(--c-text);
}
.search-box input::placeholder { color:var(--c-muted); }

.user-actions { display:flex; align-items:center; gap:12px; }
.icon-btn {
  position:relative;
  background: var(--c-surface2);
  border:1px solid var(--glass-border);
  width:38px;height:38px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--c-muted);
  transition:all var(--t-fast);
}
.icon-btn:hover { background:var(--brand-faint); border-color:var(--brand); color:var(--brand); }
.icon-btn div { width:20px;height:20px; }
.notification-badge {
  position:absolute;top:-3px;right:-3px;
  background:var(--accent);
  color:#fff;font-size:10px;
  padding:1px 5px;border-radius:10px;
  font-weight:700;pointer-events:none;
  border:2px solid var(--c-bg);
}
.user-profile { display:flex;align-items:center;gap:10px;margin-left:4px; }
.user-avatar { width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--glass-border); }
.user-name  { font-size:13px;font-weight:600;color:var(--c-text); }
.user-email { font-size:11px;color:var(--c-muted); }

/* ─────────────────────────────────────────────────────────────
   PAGE HEADER
───────────────────────────────────────────────────────────── */
.pg-header {
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:28px;
}
.pg-title   { font-size:26px;font-weight:700;color:var(--c-text);margin-bottom:3px; }
.pg-subtitle{ font-size:13px;color:var(--c-muted); }
.pg-actions { display:flex;gap:10px;align-items:center;flex-shrink:0; }

.pg-btn-primary {
  display:flex;align-items:center;gap:6px;
  padding:10px 20px;
  background:var(--accent);
  color:#fff;border:none;
  border-radius:var(--r-lg);
  font-size:13px;font-weight:600;
  box-shadow:0 4px 14px var(--accent-faint);
  transition:all var(--t-fast);
}
.pg-btn-primary:hover { background:var(--accent-d);transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-faint); }

.pg-btn-outline {
  padding:10px 20px;
  background:var(--c-surface2);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  color:var(--c-text);
  border:1px solid var(--c-border);
  border-radius:var(--r-lg);
  font-size:13px;font-weight:500;
  transition:all var(--t-fast);
}
.pg-btn-outline:hover { border-color:var(--brand);color:var(--brand);background:var(--brand-faint); }

/* ─────────────────────────────────────────────────────────────
   STAT CARDS
───────────────────────────────────────────────────────────── */
.stats-row { display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px; }
.stat-card {
  padding:20px;
  border-radius:var(--r-xl);
  background: var(--glass-bg-card);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow: var(--sh-sm), inset 0 1px 0 var(--glass-hi);
  transition:all var(--t-fast);
}
.stat-card:hover { transform:translateY(-3px);box-shadow:var(--sh-md), inset 0 1px 0 var(--glass-hi); }
.stat-icon {
  width:42px;height:42px;border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;
}
.stat-value { font-size:26px;font-weight:700;color:var(--c-text);line-height:1; }
.stat-label { font-size:12px;color:var(--c-muted);margin-top:4px; }
.stat-delta { font-size:11px;color:#22c55e;margin-top:6px;font-weight:500; }

/* ─────────────────────────────────────────────────────────────
   COURSES PAGE
───────────────────────────────────────────────────────────── */
.courses-header {
  display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;
}
.courses-title { font-size:26px;font-weight:700;color:var(--c-text); }

.course-tabs { display:flex;gap:6px; }
.tab-btn {
  padding:7px 18px;
  border:1px solid var(--c-border);
  background: var(--c-surface2);
  border-radius:999px;
  font-size:13px;font-family:inherit;color:var(--c-muted);
  transition:all var(--t-fast);
}
.tab-btn:hover:not(.active) { background:var(--brand-faint);border-color:var(--brand);color:var(--brand); }
.tab-btn.active { background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 2px 10px var(--brand-faint); }

.filters-row {
  display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;
}
.filter-btn {
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;
  background:var(--c-surface2);border:1px solid var(--c-border);
  border-radius:var(--r-md);font-size:13px;font-family:inherit;color:var(--c-muted);
  transition:all var(--t-fast);
}
.filter-btn:hover { border-color:var(--brand);color:var(--brand); }
.filter-icon { width:18px;height:18px; }
.sort-section { display:flex;align-items:center;gap:10px;font-size:13px;color:var(--c-muted); }
.sort-dropdown {
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;
  background:var(--c-surface2);border:1px solid var(--c-border);
  border-radius:var(--r-md);font-size:13px;font-family:inherit;color:var(--c-muted);
  transition:all var(--t-fast);
}
.sort-dropdown:hover { border-color:var(--brand);color:var(--brand); }

/* Course table */
.course-table {
  border-radius:var(--r-xl);
  overflow:hidden;
  border:1px solid var(--c-border);
  background:var(--glass-bg-card);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  margin-bottom:28px;
  box-shadow:var(--sh-sm), inset 0 1px 0 var(--glass-hi);
}
.table-header {
  display:grid;
  grid-template-columns:2fr 1.5fr 1fr 1.5fr 1.2fr .8fr;
  padding:12px 20px;
  border-bottom:1px solid var(--c-border);
  font-size:11px;color:var(--c-muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;
  background:var(--c-surface2);
}
.course-row {
  display:grid;
  grid-template-columns:2fr 1.5fr 1fr 1.5fr 1.2fr .8fr;
  padding:16px 20px;
  border-bottom:1px solid var(--c-divider);
  align-items:center;
  transition:background var(--t-fast);
}
.course-row:last-of-type { border-bottom:none; }
.course-row:hover { background:var(--brand-faint); }
.course-name { font-size:14px;font-weight:500;color:var(--c-text); }
.teacher-info { display:flex;align-items:center;gap:8px; }
.teacher-avatar { width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0; }
.teacher-name { font-size:13px;color:var(--c-text); }
.duration { font-size:13px;color:var(--c-muted); }
.progress-info { display:flex;flex-direction:column;gap:5px; }
.progress-label { display:flex;align-items:center;gap:6px; }
.progress-text { font-size:12px;color:var(--c-muted); }
.progress-percentage { font-size:12px;color:var(--c-muted); }
.progress-bar-container { width:80%;height:4px;background:var(--c-border);border-radius:2px;overflow:hidden; }
.progress-bar { height:100%;background:var(--brand);border-radius:3px;transition:width .4s ease; }
.students-avatars { display:flex;align-items:center; }
.student-avatar { width:26px;height:26px;border-radius:50%;border:2px solid var(--c-bg);margin-left:-5px;object-fit:cover; }
.student-avatar:first-child { margin-left:0; }
.more-students {
  width:26px;height:26px;border-radius:50%;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;
  border:2px solid var(--c-bg);margin-left:-5px;
}
.action-btn {
  padding:7px 16px;
  background:var(--accent);color:#fff;border:none;
  border-radius:var(--r-md);
  font-size:12px;font-weight:600;font-family:inherit;
  box-shadow:0 2px 8px var(--accent-faint);
  transition:all var(--t-fast);white-space:nowrap;
}
.action-btn:hover { background:var(--accent-d);transform:translateY(-1px); }

/* Pagination */
.pagination {
  display:flex;flex-direction:row;justify-content:center;align-items:center;
  gap:6px;padding:14px;
  border-top:1px solid var(--c-divider);
}
.page-btn {
  width:32px;height:32px;
  border:1px solid var(--c-border);
  background:var(--c-surface2);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-family:inherit;color:var(--c-muted);
  transition:all var(--t-fast);flex-shrink:0;
}
.page-btn:hover:not(.active):not(:disabled) { border-color:var(--brand);color:var(--brand);background:var(--brand-faint); }
.page-btn.active { background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 2px 8px var(--brand-faint); }
.page-btn:disabled { opacity:.35;cursor:default; }

/* Suggested courses */
.top-learners-section {
  border-radius:var(--r-xl);
  padding:24px;
  background:var(--glass-bg-card);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--sh-sm), inset 0 1px 0 var(--glass-hi);
  margin-bottom:24px;
}
.learners-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:18px; }
.learners-title-group { display:flex;align-items:baseline;gap:12px; }
.learners-title { font-size:17px;font-weight:700;color:var(--c-text); }
.learners-count { font-size:12px;color:var(--c-muted); }
.learners-count strong { color:var(--c-text); }
.learners-toggle {
  display:flex;gap:4px;
  background:var(--c-surface2);
  border:1px solid var(--c-border);
  padding:3px;border-radius:var(--r-lg);
}
.toggle-btn {
  padding:5px 14px;border:none;background:transparent;
  border-radius:calc(var(--r-lg) - 2px);
  font-size:12px;font-family:inherit;color:var(--c-muted);
  transition:all var(--t-fast);
}
.toggle-btn.active { background:var(--brand);color:#fff;box-shadow:0 2px 6px var(--brand-faint); }

.learners-list { display:flex;flex-direction:column; }
.learner-item {
  display:grid;grid-template-columns:50px 1fr auto auto auto auto;
  align-items:center;gap:14px;
  padding:13px 0;border-bottom:1px solid var(--c-divider);
}
.learner-item:last-child { border-bottom:none; }
.learner-avatar { width:42px;height:42px;border-radius:var(--r-md);object-fit:cover;border:1px solid var(--c-border); }
.learner-info { display:flex;flex-direction:column;gap:2px;min-width:0; }
.learner-name { font-size:13px;font-weight:600;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.learning-streak { font-size:11px;color:var(--c-muted); }
.learner-level {
  display:flex;align-items:center;gap:5px;
  font-size:12px;color:var(--c-muted);
  background:var(--c-surface2);border:1px solid var(--c-border);
  padding:5px 10px;border-radius:999px;white-space:nowrap;
}
.level-icon { width:16px;height:16px; }
.learner-date { display:flex;align-items:center;gap:5px;font-size:12px;color:var(--c-muted);white-space:nowrap; }
.date-icon { width:16px;height:16px; }
.learner-progress { display:flex;align-items:center; }
.progress-circle {
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.progress-circle svg { transform:rotate(-90deg);width:100%;height:100%; }
.progress-circle .progress-percentage {
  font-size:10px;font-weight:700;color:var(--c-muted);
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:10;pointer-events:none;margin:0;line-height:1;
}
.learner-menu-btn {
  background:transparent;border:none;font-size:18px;
  color:var(--c-light);padding:4px 8px;transition:color var(--t-fast);
}
.learner-menu-btn:hover { color:var(--c-muted); }

/* Calendar + Reviews grid */
.top-sections-container { display:grid;grid-template-columns:270px 1fr;gap:16px;margin-bottom:24px; }

.calendar-section {
  border-radius:var(--r-xl);padding:22px;
  background:var(--glass-bg-card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--sh-sm), inset 0 1px 0 var(--glass-hi);
}
.calendar-header { margin-bottom:14px; }
.calendar-title { font-size:15px;font-weight:600;color:var(--c-text);margin-bottom:10px; }
.calendar-nav { display:flex;justify-content:space-between;align-items:center; }
.calendar-month { font-size:12px;color:var(--c-muted); }
.calendar-nav-btn { background:transparent;border:none;color:var(--c-muted);font-size:17px;padding:2px 7px;transition:color var(--t-fast); }
.calendar-nav-btn:hover { color:var(--brand); }
.calendar-grid { display:grid;grid-template-columns:repeat(7,1fr);gap:4px; }
.calendar-day-header { text-align:center;font-size:10px;color:var(--c-light);font-weight:600;padding:5px 0; }
.calendar-day {
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--c-muted);border-radius:var(--r-sm);
  cursor:pointer;transition:all var(--t-fast);user-select:none;
}
.calendar-day:hover:not(.other-month) { background:var(--brand-faint);color:var(--brand); }
.calendar-day.other-month { color:var(--c-light);pointer-events:none; }
.calendar-day.has-event { background:var(--brand);color:#fff;font-weight:600;box-shadow:0 2px 6px var(--brand-faint); }
.calendar-day.selected { background:var(--accent);color:#fff;box-shadow:0 2px 6px var(--accent-faint); }

.reviews-section {
  border-radius:var(--r-xl);padding:22px;
  background:var(--glass-bg-card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--sh-sm), inset 0 1px 0 var(--glass-hi);
  overflow:hidden;
}
.reviews-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:14px; }
.reviews-title { font-size:15px;font-weight:600;color:var(--c-text); }
.add-review-btn {
  padding:5px 12px;background:transparent;color:var(--brand);
  border:1px solid var(--brand);border-radius:var(--r-md);
  font-size:12px;font-weight:500;font-family:inherit;transition:all var(--t-fast);
}
.add-review-btn:hover { background:var(--brand);color:#fff; }
.reviews-nav { display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--c-divider); }
.reviews-subject { font-size:13px;font-weight:500;color:var(--c-text); }
.reviews-nav-arrows { display:flex;gap:4px; }
.review-arrow-btn {
  background:var(--c-surface2);border:1px solid var(--c-border);
  border-radius:50%;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--c-muted);line-height:1;transition:all var(--t-fast);
}
.review-arrow-btn:hover { border-color:var(--brand);color:var(--brand); }
.reviews-list { display:flex;gap:12px;overflow-x:auto;padding-bottom:6px; }
.review-card {
  min-width:240px;padding:14px;flex-shrink:0;
  border:1px solid var(--c-border);border-radius:var(--r-lg);
  background:var(--c-surface2);
  transition:all var(--t-fast);
}
.review-card:hover { border-color:var(--brand);background:var(--brand-faint); }
.review-header { display:flex;align-items:center;gap:8px;margin-bottom:8px; }
.review-avatar { width:34px;height:34px;border-radius:50%;object-fit:cover; }
.review-user-name { font-size:12px;font-weight:600;color:var(--c-text);margin-bottom:2px; }
.review-rating { display:flex;gap:1px; }
.star { color:#f59e0b;font-size:11px; }
.star.empty { color:var(--c-border); }
.review-text { font-size:12px;color:var(--c-muted);line-height:1.5;margin-bottom:6px; }
.load-more-link { color:var(--brand);font-size:12px;font-weight:500; }

/* Schedule mini */
.schedule-section {
  border-radius:var(--r-xl);padding:26px;
  background:var(--glass-bg-card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--sh-sm), inset 0 1px 0 var(--glass-hi);
  margin-top:24px;
}
.schedule-header { text-align:center;margin-bottom:22px; }
.schedule-title { font-size:18px;font-weight:700;color:var(--c-text);margin-bottom:4px; }
.schedule-subtitle { font-size:12px;color:var(--c-muted); }
.schedule-grid {
  display:grid;grid-template-columns:60px repeat(8,1fr);
  gap:1px;background:var(--c-border);border-radius:var(--r-md);overflow:hidden;
}
.schedule-time-header,.schedule-day-label,.schedule-cell { background:var(--c-surface);padding:5px;font-size:11px;color:var(--c-muted);text-align:center; }
.schedule-time-header { font-weight:600;color:var(--c-text);font-size:10px; }
.schedule-day-label { font-weight:600;color:var(--c-text);text-align:left;padding-left:10px;display:flex;align-items:center; }
.schedule-cell { position:relative;min-height:24px;cursor:default; }
.schedule-cell.has-event { padding:2px;cursor:pointer; }
.time-slot {
  width:100%;height:100%;min-height:20px;border-radius:4px;
  transition:filter var(--t-base),opacity var(--t-base),transform var(--t-fast);
}
.time-slot.mint     { background:#a7f3d0; }
.time-slot.peach    { background:#fcd19c; }
.time-slot.orange   { background:#fb923c; }
.time-slot.blue     { background:#93c5fd; }
.time-slot.lavender { background:#c4b5fd; }
.time-slot.yellow   { background:#fde68a; }
.schedule-grid.has-active .time-slot:not(.active) { filter:saturate(.25);opacity:.5; }
.time-slot.active { box-shadow:0 2px 10px rgba(0,0,0,.15);transform:scale(1.04); }

.instructor-card {
  position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:var(--glass-bg-card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  border-radius:var(--r-xl);padding:18px;z-index:200;min-width:240px;
  animation:slideDown var(--t-base);
}
@keyframes slideDown { from{opacity:0;transform:translateX(-50%) translateY(-8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
.instructor-card::before {
  content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  border-left:6px solid transparent;border-right:6px solid transparent;
  border-bottom:6px solid var(--glass-border);
}
.instructor-header { display:flex;align-items:center;gap:10px;margin-bottom:12px; }
.instructor-avatar { width:42px;height:42px;border-radius:50%;object-fit:cover; }
.instructor-name { font-size:14px;font-weight:600;color:var(--c-text);margin-bottom:2px; }
.instructor-subject { font-size:12px;color:var(--c-muted); }
.contact-btn {
  width:100%;padding:9px;background:var(--brand);color:#fff;border:none;
  border-radius:var(--r-md);font-size:13px;font-weight:500;font-family:inherit;
  transition:background var(--t-fast);
}
.contact-btn:hover { background:var(--brand-d); }
.schedule-overlay { position:fixed;inset:0;z-index:199;display:none; }
.schedule-overlay.show { display:block; }

/* Recommended */
.recommended-section { margin-top:24px; }
.section-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:18px; }
.section-title { font-size:18px;font-weight:700;color:var(--c-text); }
.view-all-link { color:var(--brand);font-size:13px;font-weight:500;transition:color var(--t-fast); }
.view-all-link:hover { color:var(--accent); }
.recommended-cards { display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px; }
.course-card {
  padding:22px;
  border-radius:var(--r-xl);
  background:var(--glass-bg-card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--sh-sm), inset 0 1px 0 var(--glass-hi);
  transition:all var(--t-fast);
}
.course-card:hover { transform:translateY(-3px);box-shadow:var(--sh-md), inset 0 1px 0 var(--glass-hi); }
.course-tag { display:inline-block;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:600;margin-bottom:10px; }
.tag-economics { background:var(--brand-faint);color:var(--brand); }
.tag-history   { background:var(--accent-faint);color:var(--accent-d); }
.tag-math      { background:var(--c-text);color:var(--c-bg); }
.lesson-count  { font-size:11px;color:var(--c-muted);margin-bottom:8px; }
.card-title    { font-size:14px;font-weight:600;color:var(--c-text);margin-bottom:8px;line-height:1.4; }
.card-description { font-size:12px;color:var(--c-muted);line-height:1.6;margin-bottom:14px; }
.learn-more-btn {
  padding:7px 16px;background:transparent;color:var(--brand);
  border:1px solid var(--brand);border-radius:var(--r-md);
  font-size:12px;font-weight:500;font-family:inherit;transition:all var(--t-fast);
}
.learn-more-btn:hover { background:var(--brand);color:#fff; }

/* ─────────────────────────────────────────────────────────────
   SCHEDULE PAGE
───────────────────────────────────────────────────────────── */
.day-filter-row { display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px; }
.day-filter-btn {
  padding:7px 16px;border:1px solid var(--c-border);
  background:var(--c-surface2);
  border-radius:999px;font-size:13px;font-family:inherit;color:var(--c-muted);
  transition:all var(--t-fast);
}
.day-filter-btn:hover:not(.active) { border-color:var(--brand);color:var(--brand);background:var(--brand-faint); }
.day-filter-btn.active { background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 2px 8px var(--brand-faint); }
.sessions-list-container { display:flex;flex-direction:column;gap:22px; }
.session-day-label { display:flex;align-items:baseline;gap:10px;margin-bottom:12px; }
.session-day-name  { font-size:15px;font-weight:700;color:var(--c-text); }
.session-day-count { font-size:12px;color:var(--c-muted); }
.session-cards-row { display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px; }
.session-card {
  border-radius:var(--r-xl);padding:18px;
  background:var(--glass-bg-card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  border-left:4px solid var(--brand);
  box-shadow:var(--sh-sm), inset 0 1px 0 var(--glass-hi);
  transition:all var(--t-fast);
}
.session-card:hover { transform:translateY(-2px);box-shadow:var(--sh-md), inset 0 1px 0 var(--glass-hi); }
.session-card-top { display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px; }
.session-time-badge { padding:4px 10px;border-radius:var(--r-md);font-size:12px;font-weight:600; }
.session-room-badge { display:flex;align-items:center;gap:4px;font-size:11px;color:var(--c-muted);white-space:nowrap; }
.session-card-subject { font-size:15px;font-weight:600;color:var(--c-text);margin-bottom:10px; }
.session-card-instructor { display:flex;align-items:center;gap:8px;margin-bottom:14px; }
.session-instructor-avatar { width:26px;height:26px;border-radius:50%;object-fit:cover; }
.session-card-instructor span { font-size:13px;color:var(--c-muted); }
.session-card-actions { display:flex;gap:8px; }
.sess-btn-outline {
  flex:1;padding:7px;background:transparent;color:var(--brand);
  border:1px solid var(--brand);border-radius:var(--r-md);
  font-size:12px;font-family:inherit;transition:all var(--t-fast);
}
.sess-btn-outline:hover { background:var(--brand);color:#fff; }
.sess-btn-primary {
  flex:1;padding:7px;background:var(--accent);color:#fff;border:none;
  border-radius:var(--r-md);font-size:12px;font-family:inherit;font-weight:600;
  transition:all var(--t-fast);
}
.sess-btn-primary:hover { background:var(--accent-d); }
.empty-state { text-align:center;padding:60px 20px;color:var(--c-light); }
.empty-state p { margin-top:12px;font-size:14px;color:var(--c-muted); }

/* ─────────────────────────────────────────────────────────────
   RESULTS PAGE
───────────────────────────────────────────────────────────── */
.results-table-wrapper {
  border-radius:var(--r-xl);padding:24px;
  background:var(--glass-bg-card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--sh-sm), inset 0 1px 0 var(--glass-hi);
  margin-bottom:22px;
}
.results-table-hdr { display:flex;justify-content:space-between;align-items:center;margin-bottom:16px; }
.results-table-title { font-size:17px;font-weight:700;color:var(--c-text); }
.results-sort { display:flex;align-items:center;gap:8px;font-size:12px;color:var(--c-muted); }
.sort-chip {
  padding:4px 12px;border:1px solid var(--c-border);background:var(--c-surface2);
  border-radius:999px;font-size:12px;font-family:inherit;color:var(--c-muted);
  transition:all var(--t-fast);
}
.sort-chip.active { background:var(--brand);color:#fff;border-color:var(--brand); }
.sort-chip:hover:not(.active) { border-color:var(--brand);color:var(--brand); }
.results-cols-hdr {
  display:grid;grid-template-columns:2fr 1.5fr .8fr .6fr 1fr 1fr;
  padding:9px 16px;border-bottom:1px solid var(--c-border);
  font-size:11px;color:var(--c-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;
}
.results-row {
  display:grid;grid-template-columns:2fr 1.5fr .8fr .6fr 1fr 1fr;
  padding:14px 16px;border-bottom:1px solid var(--c-divider);
  align-items:center;transition:background var(--t-fast);
}
.results-row:last-child { border-bottom:none; }
.results-row:hover { background:var(--brand-faint); }
.results-course-name { font-size:13px;font-weight:500;color:var(--c-text); }
.score-cell { display:flex;align-items:baseline;gap:2px; }
.score-number { font-size:16px;font-weight:700;color:var(--c-text); }
.score-out { font-size:11px;color:var(--c-muted); }
.grade-pill { display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700; }
.grade-a { background:rgba(34,197,94,.15);color:#16a34a; }
.grade-b { background:rgba(59,130,246,.15);color:#2563eb; }
.grade-c { background:rgba(245,158,11,.15);color:#d97706; }
.status-pill { display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap; }
.status-done { background:rgba(34,197,94,.12);color:#16a34a; }
.status-near { background:var(--accent-faint);color:var(--accent-d); }
.status-prog { background:var(--c-surface2);color:var(--c-muted); }
.results-prog-cell { display:flex;flex-direction:column;gap:3px; }

.perf-overview {
  border-radius:var(--r-xl);padding:24px;
  background:var(--glass-bg-card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--sh-sm), inset 0 1px 0 var(--glass-hi);
}
.perf-title { font-size:17px;font-weight:700;color:var(--c-text);margin-bottom:18px; }
.perf-bars { display:flex;flex-direction:column;gap:13px; }
.perf-bar-row { display:grid;grid-template-columns:180px 1fr 45px;align-items:center;gap:12px; }
.perf-bar-label { font-size:12px;color:var(--c-text);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.perf-bar-track { height:8px;background:var(--c-border);border-radius:4px;overflow:hidden; }
.perf-bar-fill { height:100%;border-radius:4px;transition:width .6s ease; }
.perf-bar-pct { font-size:12px;font-weight:600;color:var(--c-text); }

/* ─────────────────────────────────────────────────────────────
   CERTIFICATIONS PAGE
───────────────────────────────────────────────────────────── */
.cert-section { margin-bottom:32px; }
.cert-section-heading {
  display:flex;align-items:center;gap:10px;
  font-size:17px;font-weight:700;color:var(--c-text);margin-bottom:18px;
}
.cert-section-icon { width:26px;height:26px;color:var(--brand);display:flex;align-items:center;justify-content:center; }
.cert-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px; }

.cert-card-earned {
  border-radius:var(--r-xl);overflow:hidden;
  background:var(--glass-bg-card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--sh-sm), inset 0 1px 0 var(--glass-hi);
  position:relative;transition:all var(--t-fast);
}
.cert-card-earned:hover { transform:translateY(-3px);box-shadow:var(--sh-md), inset 0 1px 0 var(--glass-hi); }
.cert-card-ribbon { position:absolute;top:0;right:0;width:70px;height:70px;background:var(--accent);opacity:.10;clip-path:polygon(100% 0,0 0,100% 100%); }
.cert-earned-badge { position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff; }
.cert-card-body { padding:22px 22px 14px; }
.cert-issuer { font-size:11px;color:var(--c-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px; }
.cert-title { font-size:15px;font-weight:700;color:var(--c-text);margin-bottom:14px;line-height:1.3; }
.cert-meta { display:flex;flex-direction:column;gap:5px; }
.cert-meta-row { display:flex;justify-content:space-between;font-size:12px; }
.cert-meta-label { color:var(--c-muted); }
.cert-meta-val { color:var(--c-text);font-weight:500; }
.cert-id { font-family:monospace;font-size:10px;color:var(--c-muted); }
.cert-card-footer { padding:12px 22px 20px;display:flex;gap:10px; }
.cert-btn {
  display:flex;align-items:center;gap:6px;padding:8px 16px;
  border-radius:var(--r-md);font-size:12px;font-weight:600;font-family:inherit;
  transition:all var(--t-fast);
}
.cert-btn-outline {
  background:var(--c-surface2);border:1px solid var(--c-border);
  color:var(--c-muted);flex:1;justify-content:center;
}
.cert-btn-outline:hover { border-color:var(--brand);color:var(--brand); }
.cert-btn-primary { flex:2;color:#fff;border:none;justify-content:center; }
.cert-btn-primary:hover { opacity:.9;transform:translateY(-1px); }
.cert-btn-full { width:100%;color:#fff;border:none;justify-content:center; }
.cert-btn-full:hover { opacity:.9; }

.cert-card-progress {
  border-radius:var(--r-xl);
  background:var(--glass-bg-card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--sh-sm), inset 0 1px 0 var(--glass-hi);
  transition:all var(--t-fast);
}
.cert-card-progress:hover { transform:translateY(-3px);box-shadow:var(--sh-md), inset 0 1px 0 var(--glass-hi); }
.cert-prog-top { display:flex;justify-content:space-between;align-items:center;padding:20px 22px 0; }
.cert-prog-icon { width:46px;height:46px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center; }
.cert-prog-pct { font-size:22px;font-weight:700; }
.cert-course-tag { display:inline-block;background:var(--c-surface2);color:var(--c-muted);font-size:11px;padding:2px 8px;border-radius:var(--r-sm);margin-bottom:10px; }
.cert-progress-bar-wrap { margin-bottom:8px; }
.cert-prog-track { height:5px;background:var(--c-border);border-radius:3px;overflow:hidden;margin-bottom:4px; }
.cert-prog-fill { height:100%;border-radius:3px;transition:width .6s ease; }
.cert-prog-labels { display:flex;justify-content:space-between;font-size:11px;color:var(--c-muted); }
.cert-expected { font-size:12px;color:var(--c-muted);margin-top:2px; }
.cert-expected strong { color:var(--c-text); }

/* ─────────────────────────────────────────────────────────────
   SETTINGS PAGE
───────────────────────────────────────────────────────────── */
.settings-layout { display:grid;grid-template-columns:200px 1fr;gap:18px; }
.settings-sidebar-nav {
  border-radius:var(--r-xl);padding:10px;
  background:var(--glass-bg-card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--sh-sm), inset 0 1px 0 var(--glass-hi);

  background:transparent;border:none;border-radius:var(--r-lg);
  font-size:13px;font-family:inherit;color:var(--c-muted);

.settings-nav-btn:hover:not(.active) { background:var(--brand-faint);color:var(--brand); }
.settings-nav-btn.active { background:var(--brand);color:#fff; }
.settings-nav-icon { width:18px;height:18px;flex-shrink:0; }

.settings-panel {
  border-radius:var(--r-xl);padding:30px;
  background:var(--glass-bg-card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--sh-sm), inset 0 1px 0 var(--glass-hi);
}
.settings-sec-title { font-size:18px;font-weight:700;color:var(--c-text);margin-bottom:4px; }
.settings-sec-sub   { font-size:13px;color:var(--c-muted);margin-bottom:22px; }

.profile-avatar-row {
  display:flex;align-items:center;gap:18px;padding:18px;
  background:var(--c-surface2);border:1px solid var(--c-border);
  border-radius:var(--r-xl);margin-bottom:22px;
}
.profile-avatar-wrap { position:relative;flex-shrink:0; }
.profile-big-avatar { width:68px;height:68px;border-radius:50%;object-fit:cover;border:3px solid var(--glass-border);box-shadow:var(--sh-sm); }
.avatar-edit-btn {
  position:absolute;bottom:-2px;right:-2px;
  width:22px;height:22px;background:var(--accent);color:#fff;
  border:2px solid var(--c-bg);border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.profile-name-big  { font-size:17px;font-weight:700;color:var(--c-text); }
.profile-email-big { font-size:12px;color:var(--c-muted);margin:2px 0 8px; }
.profile-role-badge { display:inline-block;background:var(--brand-faint);color:var(--brand);font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px; }

.settings-form { display:grid;grid-template-columns:1fr 1fr;gap:14px; }
.settings-field { display:flex;flex-direction:column;gap:5px; }
.settings-field-full { grid-column:1/-1; }
.settings-label { font-size:12px;font-weight:600;color:var(--c-text);text-transform:uppercase;letter-spacing:.04em; }
.settings-input {
  padding:10px 14px;
  border:1px solid var(--c-border);
  background:var(--c-surface2);
  border-radius:var(--r-md);
  font-size:13px;font-family:inherit;color:var(--c-text);
  outline:none;transition:all var(--t-fast);
}
.settings-input:focus { border-color:var(--brand);background:var(--glass-bg);box-shadow:0 0 0 3px var(--brand-faint); }
.settings-textarea {
  padding:10px 14px;border:1px solid var(--c-border);
  background:var(--c-surface2);border-radius:var(--r-md);
  font-size:13px;font-family:inherit;color:var(--c-text);
  outline:none;resize:vertical;transition:all var(--t-fast);
}
.settings-textarea:focus { border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-faint); }
.settings-save-row { margin-top:18px; }
.settings-save-btn {
  padding:11px 28px;background:var(--accent);color:#fff;border:none;
  border-radius:var(--r-lg);font-size:14px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:all var(--t-fast);box-shadow:0 4px 14px var(--accent-faint);
}
.settings-save-btn:hover { background:var(--accent-d);transform:translateY(-1px); }

/* Toggle switches */
.toggle-list { display:flex;flex-direction:column; }
.toggle-row {
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 0;border-bottom:1px solid var(--c-divider);
}
.toggle-row:last-child { border-bottom:none; }
.toggle-info { flex:1;margin-right:16px; }
.toggle-label-text { font-size:14px;font-weight:500;color:var(--c-text); }
.toggle-desc-text  { font-size:12px;color:var(--c-muted);margin-top:1px; }
.toggle-switch { position:relative;width:44px;height:24px;flex-shrink:0; }
.toggle-input  { opacity:0;width:0;height:0;position:absolute; }
.toggle-slider {
  position:absolute;cursor:pointer;inset:0;
  background:var(--c-border);border-radius:24px;transition:background var(--t-fast);
}
.toggle-slider::before {
  content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:transform var(--t-fast);
  box-shadow:0 1px 4px rgba(0,0,0,.2);
}
.toggle-input:checked + .toggle-slider { background:var(--brand); }
.toggle-input:checked + .toggle-slider::before { transform:translateX(20px); }

/* Danger zone */
.danger-zone { margin-top:24px;padding:18px;background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.18);border-radius:var(--r-xl); }
.danger-title { font-size:14px;font-weight:600;color:#dc2626;margin-bottom:12px; }
.danger-actions { display:flex;gap:10px; }
.danger-btn-outline {
  padding:8px 16px;background:transparent;color:var(--c-text);
  border:1px solid var(--c-border);border-radius:var(--r-md);
  font-size:13px;font-family:inherit;transition:all var(--t-fast);
}
.danger-btn-outline:hover { border-color:var(--brand);color:var(--brand); }
.danger-btn-red {
  padding:8px 16px;background:#dc2626;color:#fff;border:none;
  border-radius:var(--r-md);font-size:13px;font-family:inherit;font-weight:500;
  transition:background var(--t-fast);

.danger-btn-red:hover { background:#b91c1c; }

  padding:18px;background:var(--c-surface2);

.security-block-title { font-size:14px;font-weight:600;color:var(--c-text);margin-bottom:14px; }

.revoke-btn:hover { background:#dc2626;color:#fff; }

/* Appearance */
.appearance-block { margin-bottom:22px; }
.theme-options { display:flex;gap:10px;margin-top:10px;flex-wrap:wrap; }
.theme-option {

  padding:14px 20px;
  background:var(--c-surface2);
  border:2px solid var(--c-border);
  border-radius:var(--r-lg);

.theme-option:hover { border-color:var(--brand);color:var(--brand); }
.theme-option.active { border-color:var(--accent);color:var(--accent);background:var(--accent-faint); }

.font-option {

.font-option:hover { border-color:var(--brand);color:var(--brand); }
.font-option.active { background:var(--brand);color:#fff;border-color:var(--brand); }

@media (max-width:1100px) {

  .perf-bar-row { grid-template-columns:100px 1fr 36px; }
}

  .content-card { padding:16px; }
}

const avatar = (id) => `https://i.pravatar.cc/96?img=${id}`;

function buildCalendarGrid(year, month) {
  const first = new Date(year, month, 1).getDay();
  const days  = new Date(year, month+1, 0).getDate();
  const cells = [];
  for (let i=0;i<first;i++)   cells.push({day:null,blank:true});
  for (let d=1;d<=days;d++)   cells.push({day:d,blank:false});
  const trail = (7 - (cells.length%7)) % 7;
  for (let i=0;i<trail;i++)   cells.push({day:null,blank:true});
  return cells;
}

const gradeColor  = g => g==='A+'||g==='A' ? 'grade-a' : g==='B+'||g==='B' ? 'grade-b' : 'grade-c';
const statusColor = s => s==='Completed' ? 'status-done' : s==='Near Complete' ? 'status-near' : 'status-prog';

      <div className="user-actions">
        <button className="icon-btn" aria-label="Wishlist">

const Sidebar = memo(({ activeNav, onNavChange }) => (
  <aside className="sidebar" aria-label="Main navigation">
    <ul className="nav-menu" role="list">
      {NAV_ITEMS.map(({ label, key }) => (
        <li key={key} className="nav-item">
          <a href="#" className={'nav-link' + (activeNav===key ? ' active' : '')}
            onClick={(e) => { e.preventDefault(); onNavChange(key); }}
            aria-current={activeNav===key ? 'page' : undefined}>
            <span className="nav-icon" aria-hidden="true">{NAV_ICONS[key]}</span>
            <span>{label}</span>
          </a>
        </li>
      ))}
    </ul>
    <div className="settings-link">
      <a href="#" className={'nav-link' + (activeNav==='settings' ? ' active' : '')}
        onClick={(e) => { e.preventDefault(); onNavChange('settings'); }}>
        <span className="nav-icon" aria-hidden="true"><IconSettings /></span>
        <span>Settings</span>
      </a>
    </div>
  </aside>
));

const ScheduleSection = memo(() => {
  const [activeCell, setActiveCell] = useState(null);
  const activeEvent = useMemo(() => {
    if (!activeCell) return null;
    return SCHEDULE_DATA[activeCell.day]?.[activeCell.slotIdx] ?? null;
  }, [activeCell]);
  const closeCard = useCallback(() => setActiveCell(null), []);
  const handleCell = useCallback((day, slotIdx, event) => {
    if (!event) return;
    setActiveCell(prev => prev?.day===day && prev?.slotIdx===slotIdx ? null : {day,slotIdx});
  }, []);
  useEffect(() => {
    const h = e => { if (e.key==='Escape') closeCard(); };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [closeCard]);
  const hasActive = Boolean(activeEvent);
  return (
    <section className="schedule-section">
      <div className="schedule-header">
        <h2 className="schedule-title">Current week schedule</h2>
        <p className="schedule-subtitle">Click any slot to view instructor details</p>
      </div>
      <div className={'schedule-overlay'+(hasActive?' show':'')} onClick={closeCard} aria-hidden="true" />
      <div className={'schedule-grid'+(hasActive?' has-active':'')}>
        <div className="schedule-time-header" />
        {SCHEDULE_TIMES.map(t => <div key={t} className="schedule-time-header">{t}</div>)}
        {SCHEDULE_DAYS.map(day => (
          <React.Fragment key={day}>
            <div className="schedule-day-label">{day}</div>
            {SCHEDULE_DATA[day].map((event, slotIdx) => {
              const isActive = activeCell?.day===day && activeCell?.slotIdx===slotIdx;
              return (
                <div key={slotIdx} className={'schedule-cell'+(event?' has-event':'')}
                  onClick={() => handleCell(day, slotIdx, event)}>
                  {event && <div className={'time-slot '+event.color+(isActive?' active':'')} />}
                  {isActive && activeEvent && <InstructorCard event={activeEvent} onContact={(n)=>{alert(`Contacting ${n}`);closeCard();}} />}
                </div>
              );
            })}
          </React.Fragment>
        ))}
      </div>
    </section>
  );
});

const CalendarSection = memo(() => {
  const [cal, setCal] = useState({year:2016, month:11});
  const [sel, setSel] = useState(22);
  const isInit = cal.year===2016 && cal.month===11;
  const cells = useMemo(() => buildCalendarGrid(cal.year, cal.month), [cal.year, cal.month]);
  const go = useCallback(d => {
    setCal(({year,month}) => {
      let m=month+d, y=year;
      if(m<0){m=11;y--;}if(m>11){m=0;y++;}
      return {year:y,month:m};
    });
    setSel(null);
  }, []);
  return (
    <div className="calendar-section">
      <div className="calendar-header">
        <h3 className="calendar-title">Schedule session</h3>
        <div className="calendar-nav">
          <button className="calendar-nav-btn" onClick={()=>go(-1)}>‹</button>
          <span className="calendar-month">{MONTH_NAMES[cal.month]} {cal.year}</span>
          <button className="calendar-nav-btn" onClick={()=>go(1)}>›</button>
        </div>
      </div>
      <div className="calendar-grid">
        {['S','M','T','W','T','F','S'].map((d,i)=><div key={i} className="calendar-day-header">{d}</div>)}
        {cells.map((cell,i) => {
          const isBlank = cell.blank;
          const isEvent = isInit && !isBlank && CALENDAR_EVENTS_DEC_2016.has(cell.day);
          const isSel   = !isBlank && cell.day===sel;
          let cls = 'calendar-day';
          if(isBlank) cls+=' other-month';
          if(isEvent) cls+=' has-event';
          if(isSel)   cls+=' selected';
          return <div key={i} className={cls} onClick={()=>!isBlank&&setSel(cell.day)}>{!isBlank&&cell.day}</div>;
        })}
      </div>
    </div>
  );
});

const CoursesPage = memo(({ searchQuery }) => {
  const [tab,    setTab]    = useState('in-progress');
  const [page,   setPage]   = useState(1);
  const [period, setPeriod] = useState('week');
  const ITEMS = 4;

  const filtered = useMemo(() => {
    let list = COURSES;
    if(tab==='completed')   list = list.filter(c=>c.percent===100);
    if(tab==='in-progress') list = list.filter(c=>c.percent<100);
    const q = searchQuery.trim().toLowerCase();
    if(q) list = list.filter(c=>c.name.toLowerCase().includes(q)||c.instructor.toLowerCase().includes(q));
    return list;
  }, [tab, searchQuery]);

  const total = Math.max(1, Math.ceil(filtered.length/ITEMS));
  const paged = useMemo(()=>filtered.slice((page-1)*ITEMS,page*ITEMS),[filtered,page]);
  useEffect(()=>setPage(1),[tab,searchQuery]);

  return (
    <>
      <div className="courses-header">
        <h1 className="courses-title">Courses</h1>
        <div className="course-tabs">
          {[['all','All'],['in-progress','In progress'],['completed','Completed']].map(([key,label])=>(
            <button key={key} className={'tab-btn'+(tab===key?' active':'')} onClick={()=>setTab(key)}>{label}</button>
          ))}
        </div>
      </div>
      <div className="filters-row">
        <button className="filter-btn"><span className="filter-icon"><IconFilter /></span><span>Filters</span><span>▼</span></button>
        <div className="sort-section">
          <span style={{color:'var(--c-muted)',fontSize:'13px'}}>Sort by:</span>
          <button className="sort-dropdown"><span>Duration</span><span>▼</span></button>
        </div>
      </div>
      <CourseTable courses={paged} activePage={page} totalPages={Math.max(2,total)}
        onPageChange={setPage} onAction={n=>alert('Opening: '+n)} />
      <SuggestedCourses period={period} onPeriodChange={setPeriod} />
      <div className="top-sections-container">
        <CalendarSection />
        <ReviewsSection />
      </div>
      <ScheduleSection />
      <RecommendedSection />
    </>
  );
});

  return (
    <>
      <PageHeader title="Certifications" subtitle="Your credentials and milestones">
        <button className="pg-btn-outline">Browse Courses</button>
      </PageHeader>
      <div className="stats-row">
        <StatCard icon={<IconCheck/>}    iconBg="rgba(34,197,94,.13)"  value={earned.length}  label="Earned"       delta="↑ 1 this month"/>
        <StatCard icon={<IconGraduate/>} iconBg="rgba(99,102,241,.12)" value={inprog.length}  label="In Progress"/>
        <StatCard icon={<IconStar/>}     iconBg="rgba(238,166,117,.15)"value={CERTIFICATIONS_DATA.length} label="Total"/>
        <StatCard icon={<IconCalendar/>} iconBg="rgba(239,68,68,.10)"  value="May 2025"       label="Next Expected"/>
      </div>
      <section className="cert-section">
        <h2 className="cert-section-heading"><span className="cert-section-icon"><IconCheck/></span>Earned Certificates</h2>
        <div className="cert-grid">{earned.map(c=><CertCard key={c.id} cert={c}/>)}</div>
      </section>
      <section className="cert-section">
        <h2 className="cert-section-heading"><span className="cert-section-icon"><IconGraduate/></span>In Progress</h2>
        <div className="cert-grid">{inprog.map(c=><CertCard key={c.id} cert={c}/>)}</div>
      </section>
    </>
  );
});

/* ═══════════════════════════════════════════════════════
   SETTINGS PAGE  – receives darkMode state from App
═══════════════════════════════════════════════════════ */
const ToggleSwitch = memo(({ id, checked, onChange }) => (
  <label className="toggle-switch" htmlFor={id}>
    <input type="checkbox" id={id} className="toggle-input" checked={checked} onChange={e=>onChange(e.target.checked)} />
    <span className="toggle-slider"/>
  </label>
));

const SettingsPage = memo(({ darkMode, onDarkModeChange }) => {
  const [section, setSection] = useState('profile');
  const [profileForm, setProfileForm] = useState({
    name:'Adam Youssef', email:'adam.y@thync.com', phone:'+20 100 123 4567',
    bio:'Passionate learner focused on AI, cloud, and business strategy.',
    location:'Cairo, Egypt', website:'adamyoussef.io',
  });
  const [notifState, setNotifState] = useState(()=>{const s={};NOTIF_SETTINGS_DATA.forEach(n=>{s[n.id]=n.defaultOn;});return s;});
  const [privState,  setPrivState]  = useState(()=>{const s={};PRIVACY_SETTINGS_DATA.forEach(p=>{s[p.id]=p.defaultOn;});return s;});
  const [passwords,  setPasswords]  = useState({current:'',newPwd:'',confirm:''});
  const [twoFactor,  setTwoFactor]  = useState(false);
  const [fontSize,   setFontSize]   = useState('medium');
  const [saved,      setSaved]      = useState(false);

  const handleSave = useCallback(()=>{setSaved(true);setTimeout(()=>setSaved(false),2000);},[]);

  const SECS = [
    {key:'profile',       label:'Profile',       icon:<IconUser/>},
    {key:'notifications', label:'Notifications', icon:<IconBellOutline/>},
    {key:'privacy',       label:'Privacy',       icon:<IconEye/>},
    {key:'security',      label:'Security',      icon:<IconShield/>},
    {key:'appearance',    label:'Appearance',    icon:<IconPalette/>},
  ];

  return (
    <div>
      <PageHeader title="Settings" subtitle="Manage your account and preferences"/>
      <div className="settings-layout">
        <nav className="settings-sidebar-nav">
          {SECS.map(({key,label,icon})=>(
            <button key={key} className={'settings-nav-btn'+(section===key?' active':'')} onClick={()=>setSection(key)}>
              <span className="settings-nav-icon">{icon}</span>{label}
            </button>
          ))}
        </nav>
        <div className="settings-panel">

          {section==='profile' && (
            <div>
              <h2 className="settings-sec-title">Profile Information</h2>
              <p className="settings-sec-sub">Update your personal details.</p>
              <div className="profile-avatar-row">
                <div className="profile-avatar-wrap">
                  <img src={avatar(5)} alt="Adam Youssef" className="profile-big-avatar"/>
                  <button className="avatar-edit-btn" aria-label="Change photo"><IconEdit/></button>
                </div>
                <div>
                  <div className="profile-name-big">{profileForm.name}</div>
                  <div className="profile-email-big">{profileForm.email}</div>
                  <div className="profile-role-badge">Student · Pro Plan</div>
                </div>
              </div>
              <div className="settings-form">
                {[{field:'name',label:'Full Name',type:'text'},{field:'email',label:'Email',type:'email'},{field:'phone',label:'Phone',type:'tel'},{field:'location',label:'Location',type:'text'},{field:'website',label:'Website',type:'url'}].map(({field,label,type})=>(
                  <div key={field} className="settings-field">
                    <label className="settings-label" htmlFor={'p-'+field}>{label}</label>
                    <input id={'p-'+field} type={type} className="settings-input" value={profileForm[field]}
                      onChange={e=>setProfileForm(f=>({...f,[field]:e.target.value}))} maxLength={120}/>
                  </div>
                ))}
                <div className="settings-field settings-field-full">
                  <label className="settings-label" htmlFor="p-bio">Bio</label>
                  <textarea id="p-bio" className="settings-textarea" value={profileForm.bio}
                    onChange={e=>setProfileForm(f=>({...f,bio:e.target.value}))} rows={3} maxLength={280}/>
                </div>
              </div>
              <div className="settings-save-row">
                <button className="settings-save-btn" onClick={handleSave}>{saved?'✓ Saved!':'Save Changes'}</button>
              </div>
            </div>
          )}

          {section==='notifications' && (
            <div>
              <h2 className="settings-sec-title">Notification Preferences</h2>
              <p className="settings-sec-sub">Choose what updates you receive.</p>
              <div className="toggle-list">
                {NOTIF_SETTINGS_DATA.map(item=>(
                  <div key={item.id} className="toggle-row">
                    <div className="toggle-info">
                      <div className="toggle-label-text">{item.label}</div>
                      <div className="toggle-desc-text">{item.description}</div>
                    </div>
                    <ToggleSwitch id={item.id} checked={notifState[item.id]} onChange={v=>setNotifState(s=>({...s,[item.id]:v}))}/>
                  </div>
                ))}
              </div>
            </div>
          )}

          {section==='privacy' && (
            <div>
              <h2 className="settings-sec-title">Privacy Settings</h2>
              <p className="settings-sec-sub">Control who can see your information.</p>
              <div className="toggle-list">
                {PRIVACY_SETTINGS_DATA.map(item=>(
                  <div key={item.id} className="toggle-row">
                    <div className="toggle-info">
                      <div className="toggle-label-text">{item.label}</div>
                      <div className="toggle-desc-text">{item.description}</div>
                    </div>
                    <ToggleSwitch id={item.id} checked={privState[item.id]} onChange={v=>setPrivState(s=>({...s,[item.id]:v}))}/>
                  </div>
                ))}
              </div>
              <div className="danger-zone">
                <h3 className="danger-title">Data & Account</h3>
                <div className="danger-actions">
                  <button className="danger-btn-outline" onClick={()=>alert('Downloading data…')}>Download my data</button>
                  <button className="danger-btn-red" onClick={()=>{if(window.confirm('Delete account? This cannot be undone.'))alert('Deletion requested.');}}>Delete account</button>
                </div>
              </div>
            </div>
          )}

          {section==='security' && (
            <div>
              <h2 className="settings-sec-title">Security</h2>
              <p className="settings-sec-sub">Manage your password and account access.</p>
              <div className="security-block">
                <h3 className="security-block-title">Change Password</h3>
                {[{field:'current',label:'Current Password'},{field:'newPwd',label:'New Password'},{field:'confirm',label:'Confirm Password'}].map(({field,label})=>(
                  <div key={field} className="settings-field" style={{marginBottom:'12px'}}>
                    <label className="settings-label" htmlFor={'pwd-'+field}>{label}</label>
                    <input id={'pwd-'+field} type="password" className="settings-input" value={passwords[field]}
                      onChange={e=>setPasswords(p=>({...p,[field]:e.target.value}))} autoComplete="new-password"/>
                  </div>
                ))}
                <button className="settings-save-btn" onClick={()=>{
                  if(!passwords.newPwd){alert('Enter a new password.');return;}
                  if(passwords.newPwd!==passwords.confirm){alert('Passwords do not match.');return;}
                  alert('Password updated!');setPasswords({current:'',newPwd:'',confirm:''});
                }}>Update Password</button>
              </div>
              <div className="security-block">
                <div className="toggle-row">
                  <div className="toggle-info">
                    <div className="toggle-label-text">Two-factor authentication</div>
                    <div className="toggle-desc-text">Add extra security via SMS or authenticator app.</div>
                  </div>
                  <ToggleSwitch id="two-factor" checked={twoFactor} onChange={setTwoFactor}/>
                </div>
              </div>
              <div className="security-block">
                <h3 className="security-block-title">Active Sessions</h3>
                {[{device:'Chrome on Windows 11',location:'Cairo, Egypt',current:true},{device:'Safari on iPhone 15',location:'Alexandria, EG',current:false}].map((s,i)=>(
                  <div key={i} className="session-item-security">
                    <div>
                      <div className="session-device-name">{s.device}{s.current&&<span className="current-badge">Current</span>}</div>
                      <div className="session-device-loc">{s.location}</div>
                    </div>
                    {!s.current&&<button className="revoke-btn" onClick={()=>alert('Session revoked')}>Revoke</button>}
                  </div>
                ))}
              </div>
            </div>
          )}

          {section==='appearance' && (
            <div>
              <h2 className="settings-sec-title">Appearance</h2>
              <p className="settings-sec-sub">Customize how Thync looks on your device.</p>

              <div className="appearance-block">
                <label className="settings-label">Theme</label>
                <div className="theme-options">
                  {[
                    {key:'light', label:'Light', icon:<IconSun/>},
                    {key:'dark',  label:'Dark',  icon:<IconMoon/>},
                  ].map(({key,label,icon})=>(
                    <button key={key} className={'theme-option'+((!darkMode&&key==='light')||(darkMode&&key==='dark')?' active':'')}
                      onClick={()=>onDarkModeChange(key==='dark')}>
                      <span className="theme-icon">{icon}</span>
                      <span>{label}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="appearance-block">
                <label className="settings-label">Font Size</label>
                <div className="font-size-options">
                  {['small','medium','large'].map(s=>(
                    <button key={s} className={'font-option'+(fontSize===s?' active':'')} onClick={()=>setFontSize(s)}>
                      {s.charAt(0).toUpperCase()+s.slice(1)}
                    </button>
                  ))}
                </div>
              </div>

              <div className="appearance-block">
                <label className="settings-label" htmlFor="lang-sel">Language</label>
                <select id="lang-sel" className="settings-input" style={{width:'220px'}} onChange={e=>alert('Language: '+e.target.value)}>
                  <option>English (US)</option><option>العربية</option><option>Français</option><option>Español</option>
                </select>
              </div>
            </div>
          )}

        </div>
      </div>
    </div>
  );
});

/* ═══════════════════════════════════════════════════════
   APP ROOT
═══════════════════════════════════════════════════════ */
function App() {
  const [activeRoute, setActiveRoute] = useState('courses');
  const [searchQuery, setSearchQuery] = useState('');
  const [darkMode,    setDarkMode]    = useState(false);

  /* Apply/remove dark class on <html> */
  useEffect(() => {
    document.documentElement.classList.toggle('dark', darkMode);
  }, [darkMode]);

  const renderPage = () => {
    switch(activeRoute) {
      case 'home':           return <CoursesPage searchQuery={searchQuery}/>;
      case 'courses':        return <CoursesPage searchQuery={searchQuery}/>;
      case 'schedule':       return <SchedulePage/>;
      case 'results':        return <ResultsPage/>;
      case 'certifications': return <CertificationsPage/>;
      case 'settings':       return <SettingsPage darkMode={darkMode} onDarkModeChange={setDarkMode}/>;
      default:               return <CoursesPage searchQuery={searchQuery}/>;
    }
  };

  return (
    <div className="app-shell">
      <Sidebar activeNav={activeRoute} onNavChange={setActiveRoute}/>
      <div className="main-col">
        <TopBar searchQuery={searchQuery} onSearchChange={setSearchQuery}/>
        <div className="scroll-area">
          <div className="content-card">
            {renderPage()}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Boot ── */
const rootEl = document.getElementById('root');
if (rootEl) {
  ReactDOM.createRoot(rootEl).render(<React.StrictMode><App/></React.StrictMode>);
} else {
  console.error('[Thync] #root not found');
}

  </script>
</body>
</html>
